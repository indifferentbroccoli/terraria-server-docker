# bOSS Health Check Baseline — Rust
# Tier: Full

GAME_ID="rust"
GAME_NAME="Rust"
HEALTHCHECK_TIER="full"

PROCESS_PATTERN="RustDedicated"

PRIMARY_PORT="${RUST_SERVER_PORT:-28015}"
PRIMARY_PROTOCOL="udp"

QUERY_TYPE="steam_query"
STEAM_QUERY_ENABLED="true"
STEAM_QUERY_PORT="${RUST_SERVER_PORT:-28015}"

RCON_BOOT_VERIFY="true"
RCON_BOOT_VERIFY_RETRIES="5"
RCON_BOOT_VERIFY_DELAY="15"
RCON_PORT="${RUST_RCON_PORT:-28016}"
RCON_PASSWORD_VAR="RUST_RCON_PASSWORD"
RCON_CMD="rcon-cli"
RCON_TEST_COMMAND="status"

API_HEALTH_ENABLED="false"
BUILTIN_STATUS_CMD=""

BOOT_GRACE_SECONDS="900"
MIN_MEMORY_MB="500"
MIN_DISK_MB="500"
DISK_CHECK_PATH="/steamcmd/rust"

FIFO_ENABLED="false"
WORLD_FILE_CHECK="false"
