# bOSS Health Check Baseline — Project Zomboid
# Tier: Full

GAME_ID="projectzomboid"
GAME_NAME="Project Zomboid"
HEALTHCHECK_TIER="full"

PROCESS_PATTERN="ProjectZomboid"

PRIMARY_PORT="${DEFAULT_PORT:-16261}"
PRIMARY_PROTOCOL="udp"

QUERY_TYPE="steam_query"
STEAM_QUERY_ENABLED="true"
STEAM_QUERY_PORT="${DEFAULT_PORT:-16261}"

RCON_BOOT_VERIFY="true"
RCON_BOOT_VERIFY_RETRIES="5"
RCON_BOOT_VERIFY_DELAY="15"
RCON_PORT="${RCON_PORT:-27015}"
RCON_PASSWORD_VAR="RCON_PASSWORD"
RCON_CMD="rcon-cli"
RCON_TEST_COMMAND="players"

API_HEALTH_ENABLED="false"
BUILTIN_STATUS_CMD=""

BOOT_GRACE_SECONDS="600"
MIN_MEMORY_MB="200"
MIN_DISK_MB="200"
DISK_CHECK_PATH="/project-zomboid"

FIFO_ENABLED="false"
WORLD_FILE_CHECK="true"
WORLD_FILE_PATTERN="/project-zomboid-config/Saves/**/*.json"
