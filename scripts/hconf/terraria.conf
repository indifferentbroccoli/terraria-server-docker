# bOSS Health Check Baseline — Terraria
# Tier: Basic

GAME_ID="terraria"
GAME_NAME="Terraria"
HEALTHCHECK_TIER="basic"

PROCESS_PATTERN="TerrariaServer|dotnet|ScriptCaller"

PRIMARY_PORT="${GAME_PORT:-7777}"
