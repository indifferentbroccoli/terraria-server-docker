BOOT_GRACE_SECONDS="300"
MIN_MEMORY_MB="50"
MIN_DISK_MB="100"
DISK_CHECK_PATH="/terraria"

FIFO_ENABLED="true"
FIFO_PATH="/tmp/terraria-stdin"
WORLD_FILE_CHECK="true"
WORLD_FILE_PATTERN="/terraria/worlds/*.wld"
