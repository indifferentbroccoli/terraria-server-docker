# bOSS Health Check Baseline — Hytale
# Tier: Basic

GAME_ID="hytale"
GAME_NAME="Hytale"
HEALTHCHECK_TIER="basic"

PROCESS_PATTERN="java|HytaleServer"

PRIMARY_PORT="${GAME_PORT:-5520}"
PRIMARY_PROTOCOL="udp"

QUERY_TYPE="none"
STEAM_QUERY_ENABLED="false"
RCON_BOOT_VERIFY="false"
API_HEALTH_ENABLED="false"
BUILTIN_STATUS_CMD=""

# First boot needs OAuth — be very generous
BOOT_GRACE_SECONDS="900"
MIN_MEMORY_MB="200"
MIN_DISK_MB="200"
DISK_CHECK_PATH="/home/hytale/server-files"

FIFO_ENABLED="true"
FIFO_PATH="/tmp/hytale-stdin"
WORLD_FILE_CHECK="false"
