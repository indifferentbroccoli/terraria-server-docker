---
services:
  terraria:
    image: indifferentbroccoli/terraria-server-docker
    restart: unless-stopped
    container_name: terraria
    stop_grace_period: 30s
    ports:
      - '7777:7777/tcp'
    environment:
      PUID: 1000
      PGID: 1000
    env_file:
      - .env.example
    stdin_open: true
    tty: true
    volumes:
      - ./terraria:/terraria
